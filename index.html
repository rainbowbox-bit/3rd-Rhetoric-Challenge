<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國小修辭大挑戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0fdf4; /* Light green background */
            background-image: radial-gradient(#bbf7d0 2px, transparent 2px);
            background-size: 30px 30px;
        }
        .bounce-in {
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in forwards;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div id="app" class="w-full max-w-2xl bg-white rounded-3xl shadow-2xl overflow-hidden border-4 border-green-400 relative">
    
    <!-- Start Screen -->
    <div id="start-screen" class="p-10 text-center flex flex-col items-center justify-center h-full fade-in">
        <div class="text-6xl mb-4">🏆</div>
        <h1 class="text-4xl md:text-5xl font-black text-green-600 mb-4 tracking-wider">修辭大挑戰</h1>
        <p class="text-lg text-gray-600 mb-8 font-bold">每次隨機挑選 10 題，看看你能拿幾分！</p>
        <button onclick="startGame()" class="bg-green-500 hover:bg-green-600 text-white font-bold text-2xl py-4 px-12 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95">
            開始挑戰！
        </button>
        <p class="mt-6 text-sm text-gray-400">背景題庫目前收錄：<span id="pool-size" class="font-bold text-green-500"></span> 題</p>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="hidden flex flex-col h-full fade-in">
        <!-- Header / Progress -->
        <div class="bg-green-500 p-4 text-white flex justify-between items-center shadow-md">
            <div class="font-bold text-lg">第 <span id="current-question-num">1</span> / 10 題</div>
            <div class="font-bold text-lg">分數：<span id="score-display">0</span></div>
        </div>
        <div class="w-full bg-green-200 h-2">
            <div id="progress-bar" class="bg-yellow-400 h-2 transition-all duration-300" style="width: 10%;"></div>
        </div>

        <div class="p-6 md:p-8 flex-grow flex flex-col">
            <!-- Question -->
            <div class="mb-6">
                <h2 id="question-text" class="text-2xl md:text-3xl font-bold text-gray-800 leading-snug"></h2>
            </div>

            <!-- Hint Button & Text -->
            <div class="mb-6">
                <button onclick="toggleHint()" class="text-yellow-600 font-bold bg-yellow-100 hover:bg-yellow-200 px-4 py-2 rounded-full flex items-center transition text-sm">
                    💡 點我看小提示
                </button>
                <div id="hint-text" class="hidden mt-3 p-3 bg-blue-50 text-blue-700 rounded-xl text-sm font-bold border border-blue-200"></div>
            </div>

            <!-- Options -->
            <div id="options-container" class="space-y-3 flex-grow">
                <!-- Options injected via JS -->
            </div>

            <!-- Feedback / Rationale Area -->
            <div id="feedback-area" class="hidden mt-6 p-4 rounded-2xl bounce-in">
                <div class="flex items-center mb-2">
                    <span id="feedback-icon" class="text-3xl mr-3"></span>
                    <h3 id="feedback-title" class="text-xl font-black"></h3>
                </div>
                <p id="feedback-rationale" class="text-gray-700 font-bold mb-4"></p>
                <button onclick="nextQuestion()" id="next-btn" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-xl transition transform active:scale-95 text-lg">
                    下一題 ➡️
                </button>
            </div>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden p-10 text-center flex flex-col items-center justify-center h-full fade-in">
        <div id="result-emoji" class="text-7xl mb-4 bounce-in"></div>
        <h2 class="text-4xl font-black text-gray-800 mb-2">挑戰結束！</h2>
        <p class="text-2xl text-gray-600 mb-6 font-bold">你的得分是：</p>
        <div class="text-6xl font-black text-green-500 mb-8" id="final-score"></div>
        <p id="result-message" class="text-xl font-bold text-blue-600 mb-8"></p>
        <button onclick="resetGame()" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-black text-2xl py-4 px-12 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95">
            再來玩一次！
        </button>
    </div>

</div>

                { text: "感嘆", isCorrect: false, rationale: "沒有驚嘆詞。" }
            ]
        },
        {
            q: "「他因為做了壞事，最後被警察抓進了『鐵窗』裡。」這句話的『鐵窗』用了什麼修辭？",
            hint: "裝滿鐵窗、用來關壞人的地方是哪裡？",
            options: [
                { text: "借代", isCorrect: true, rationale: "用監獄的特徵『鐵窗』，來代替『監獄』這個地方。" },
                { text: "轉化", isCorrect: false, rationale: "鐵窗沒有變成別的東西。" },
                { text: "倒反", isCorrect: false, rationale: "沒有說反話。" },
                { text: "摹寫", isCorrect: false, rationale: "不是感官描寫。" }
            ]
        },
        {
            q: "「這個班的『智多星』又想出了一個解決問題的好辦法。」這句話使用了哪種修辭？",
            hint: "『智多星』通常是指哪一種人呢？",
            options: [
                { text: "借代", isCorrect: true, rationale: "用『智多星』來代替『非常聰明、點子很多的人』。" },
                { text: "譬喻", isCorrect: false, rationale: "沒有打比方。" },
                { text: "設問", isCorrect: false, rationale: "沒有問號。" },
                { text: "映襯", isCorrect: false, rationale: "沒有對比。" }
            ]
        }
    ];

    let currentQuizQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let hasAnswered = false;

    // Fisher-Yates Shuffle 隨機打亂陣列
    function shuffleArray(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    // 初始化介面顯示總題庫數量
    document.getElementById('pool-size').innerText = questionPool.length;

    function startGame() {
        // 從大題庫中隨機抽取 10 題
        const shuffledPool = shuffleArray([...questionPool]);
        currentQuizQuestions = shuffledPool.slice(0, 10);
        
        currentQuestionIndex = 0;
        score = 0;
        
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        
        updateScore();
        loadQuestion();
    }

    function loadQuestion() {
        hasAnswered = false;
        const currentQ = currentQuizQuestions[currentQuestionIndex];
        
        // Update progress
        document.getElementById('current-question-num').innerText = currentQuestionIndex + 1;
        document.getElementById('progress-bar').style.width = `${((currentQuestionIndex + 1) / 10) * 100}%`;
        
        // Set question text
        document.getElementById('question-text').innerText = currentQ.q;
        
        // Reset Hint
        const hintText = document.getElementById('hint-text');
        hintText.innerText = currentQ.hint;
        hintText.classList.add('hidden');
        
        // Reset Feedback
        document.getElementById('feedback-area').classList.add('hidden');
        
        // Load Options (shuffle them too!)
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        const shuffledOptions = shuffleArray([...currentQ.options]);
        
        shuffledOptions.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = `w-full text-left p-4 rounded-xl border-2 border-gray-200 bg-gray-50 hover:bg-green-50 hover:border-green-300 font-bold text-gray-700 transition transform active:scale-[0.98] option-btn`;
            btn.innerText = `${String.fromCharCode(65 + index)}. ${opt.text}`;
            btn.onclick = () => selectAnswer(btn, opt);
            optionsContainer.appendChild(btn);
        });
    }

    function toggleHint() {
        const hintText = document.getElementById('hint-text');
        hintText.classList.toggle('hidden');
    }

    function selectAnswer(selectedBtn, optionData) {
        if (hasAnswered) return; // Prevent multiple clicks
        hasAnswered = true;

        const allBtns = document.querySelectorAll('.option-btn');
        const feedbackArea = document.getElementById('feedback-area');
        const feedbackIcon = document.getElementById('feedback-icon');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackRationale = document.getElementById('feedback-rationale');
        const nextBtn = document.getElementById('next-btn');

        // Disable all buttons and show styling
        allBtns.forEach(btn => {
            btn.classList.remove('hover:bg-green-50', 'hover:border-green-300');
            btn.classList.add('opacity-60', 'cursor-not-allowed');
            // If this was the correct answer, highlight it in green regardless of what user clicked
            if (btn.innerText.includes(currentQuizQuestions[currentQuestionIndex].options.find(o => o.isCorrect).text)) {
                btn.classList.remove('opacity-60', 'bg-gray-50', 'border-gray-200');
                btn.classList.add('bg-green-100', 'border-green-500', 'text-green-800', 'ring-2', 'ring-green-400', 'opacity-100');
            }
        });

        feedbackArea.classList.remove('hidden', 'bg-red-100', 'bg-green-100');
        
        if (optionData.isCorrect) {
            score += 10;
            updateScore();
            selectedBtn.classList.remove('opacity-60');
            // Add pop animation
            selectedBtn.classList.add('scale-105');
            
            feedbackArea.classList.add('bg-green-100');
            feedbackIcon.innerText = "🎉";
            feedbackTitle.innerText = "答對了！太棒了！";
            feedbackTitle.classList.add('text-green-700');
        } else {
            // Highlight chosen wrong answer
            selectedBtn.classList.remove('opacity-60', 'bg-gray-50', 'border-gray-200');
            selectedBtn.classList.add('bg-red-100', 'border-red-500', 'text-red-800', 'opacity-100');
            
            feedbackArea.classList.add('bg-red-100');
            feedbackIcon.innerText = "💪";
            feedbackTitle.innerText = "哎呀，答錯了！再接再厲！";
            feedbackTitle.classList.add('text-red-700');
            feedbackTitle.classList.remove('text-green-700');
        }

        feedbackRationale.innerText = optionData.rationale;
        
        // Change next button text if it's the last question
        if (currentQuestionIndex === 9) {
            nextBtn.innerText = "看總成績 🏆";
            nextBtn.classList.replace('bg-blue-500', 'bg-purple-500');
            nextBtn.classList.replace('hover:bg-blue-600', 'hover:bg-purple-600');
        } else {
            nextBtn.innerText = "下一題 ➡️";
            nextBtn.classList.replace('bg-purple-500', 'bg-blue-500');
            nextBtn.classList.replace('hover:bg-purple-600', 'hover:bg-blue-600');
        }
    }

    function nextQuestion() {
        if (currentQuestionIndex < 9) {
            currentQuestionIndex++;
            loadQuestion();
        } else {
            showResultScreen();
        }
    }

    function updateScore() {
        document.getElementById('score-display').innerText = score;
    }

    function showResultScreen() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        
        const finalScoreDisplay = document.getElementById('final-score');
        const resultMessage = document.getElementById('result-message');
        const resultEmoji = document.getElementById('result-emoji');
        
        finalScoreDisplay.innerText = `${score} 分`;
        
        if (score === 100) {
            resultEmoji.innerText = "👑";
            resultMessage.innerText = "太神啦！修辭大師就是你！全對！";
            resultMessage.className = "text-xl font-bold text-yellow-600 mb-8";
        } else if (score >= 80) {
            resultEmoji.innerText = "🌟";
            resultMessage.innerText = "表現非常棒！你已經掌握大部分的修辭囉！";
            resultMessage.className = "text-xl font-bold text-green-600 mb-8";
        } else if (score >= 60) {
            resultEmoji.innerText = "👍";
            resultMessage.innerText = "不錯喔！多練習幾次一定會更厲害！";
            resultMessage.className = "text-xl font-bold text-blue-600 mb-8";
        } else {
            resultEmoji.innerText = "📚";
            resultMessage.innerText = "加油加油！看看小提示，再挑戰一次吧！";
            resultMessage.className = "text-xl font-bold text-gray-600 mb-8";
        }
    }

    function resetGame() {
        // Just call startGame again to draw a new set of 10 questions
        startGame();
    }
</script>
</body>
</html>
